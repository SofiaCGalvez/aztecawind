<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Azteca Wind</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link href="./dist/output.css" rel="stylesheet">
</head>

<body>
  <div id="root">
    <div class="min-h-screen bg-white">
      <nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-transparent">
        <div class="max-w-7xl mx-auto px-6 py-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <img alt="Azteca Wind" class="h-10 w-auto object-contain" src="images/logo.png">
            </div>
            <div class="hidden md:flex items-center space-x-8">
              <button class="text-sm font-medium text-white/80 hover:text-blue-400 transition-colors cursor-pointer whitespace-nowrap">Inicio</button>
              <button class="text-sm font-medium text-white/80 hover:text-blue-400 transition-colors cursor-pointer whitespace-nowrap">Nosotros</button>
              <button class="text-sm font-medium text-white/80 hover:text-blue-400 transition-colors cursor-pointer whitespace-nowrap">Vuelos</button>
              <button class="text-sm font-medium text-white/80 hover:text-blue-400 transition-colors cursor-pointer whitespace-nowrap">Galeria</button>
              <button class="text-sm font-medium text-white/80 hover:text-blue-400 transition-colors cursor-pointer whitespace-nowrap">Contacto</button>
              <button class="text-sm font-medium text-white/80 hover:text-blue-400 transition-colors cursor-pointer whitespace-nowrap">FAQ</button>
              <button class="text-sm font-medium text-white/80 hover:text-blue-400 transition-colors cursor-pointer whitespace-nowrap">Eventos</button>
            </div>
            <button class="hidden md:block px-6 py-2.5 rounded-full text-sm font-medium border-2 border-blue-500 text-white hover:bg-blue-500/20 transition-all duration-300 cursor-pointer whitespace-nowrap">Reservar vuelo</button>
        </div>
      </nav>
      <section id="home" class="relative h-screen w-full overflow-hidden">
        <div class="absolute inset-0 w-full h-full">
          <video autoplay loop playsinline class="w-full h-full object-cover">
            <source src="videos/homevideo.mp4" type="video/mp4">
          </video>
          <div class="absolute inset-0 bg-gradient-to-b from-black/30 via transparent to-black/50"></div>
        </div>
      </section>
    </div>
  </div>




</body>
</html>
